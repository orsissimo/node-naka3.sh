<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Monitoring - Stacks Blockchain Tools</title>
    <link rel="stylesheet" href="advanced-styles.css">
  </head>
  <body>
    <h1>Advanced Monitoring - Stacks Blockchain Tools</h1>

    <div class="container">
      <div class="left-panel">
        <div class="monitor-controls">
          <h2>Chain Monitor</h2>
          <select id="minerSelectMonitor">
            <option value="miner1">Miner 1 (Port 20443)</option>
            <option value="miner2">Miner 2 (Port 30443)</option>
            <option value="miner3">Miner 3 (Port 40443)</option>
          </select>
          <button onclick="startMonitoring()" id="startMonitorBtn">
            Start Monitoring
          </button>
          <button
            onclick="stopMonitoring()"
            id="stopMonitorBtn"
            style="display: none"
          >
            Stop Monitoring
          </button>
        </div>

        <div id="monitorOutput" class="monitor-output"></div>
      </div>

      <div class="right-panel">
        <div class="controls">
          <h2>Transaction Operations</h2>

          <h3>Create Transaction</h3>
          <select id="minerSelectTx">
            <option value="miner1">Miner 1 (Port 20443)</option>
            <option value="miner2">Miner 2 (Port 30443)</option>
            <option value="miner3">Miner 3 (Port 40443)</option>
          </select>
          <button onclick="createTransaction()">Create Transaction</button>

          <h3>Deploy Contract</h3>
          <select id="minerSelectContract">
            <option value="miner1">Miner 1 (Port 20443)</option>
            <option value="miner2">Miner 2 (Port 30443)</option>
            <option value="miner3">Miner 3 (Port 40443)</option>
          </select>
          <button onclick="deployContract()">Deploy Contract</button>
        </div>

        <div class="log-container">
          <h2>Transaction Log</h2>
          <div id="transactionLog"></div>
        </div>
      </div>
    </div>

    <script>
      let monitorProcess = null;
      let transactions = [];
      let transactionCounter = 1;

      function generateTransactionId() {
        return `tx_${Date.now()}_${transactionCounter++}`;
      }

      function addLogEntry(txId, type, miner, status = "mempool") {
        const timestamp = new Date().toLocaleTimeString();
        const transaction = {
          id: txId,
          type: type,
          miner: miner,
          status: status,
          timestamp: timestamp,
          realTxId: null,
          fullOutput: "",
          nonce: null,
          stacksHeight: null,
          burnHeight: null,
          errorReason: null,
        };

        transactions.push(transaction);
        updateLogDisplay();
        return transaction;
      }

      function updateTransactionStatus(
        txId,
        status,
        realTxId = null,
        fullOutput = null
      ) {
        const tx = transactions.find((t) => t.id === txId);
        if (tx) {
          tx.status = status;
          if (realTxId) {
            tx.realTxId = realTxId;
          }
          if (fullOutput !== null) {
            tx.fullOutput = fullOutput;
            // Extract blockchain data from output
            extractBlockchainData(tx, fullOutput);
          }
          updateLogDisplay();
        }
      }

      function extractBlockchainData(tx, output) {
        // Extract nonce
        const nonceMatch = output.match(/Nonce: (\d+)/);
        if (nonceMatch) {
          tx.nonce = nonceMatch[1];
        }

        // Extract block heights
        const heightMatch = output.match(/Block: (\d+)→(\d+)/);
        if (heightMatch) {
          tx.stacksHeight = heightMatch[2];
        }

        // Extract error reason from JSON error response
        const errorMatch = output.match(/"reason":"([^"]+)"/);
        if (errorMatch) {
          tx.errorReason = errorMatch[1];
          tx.status = "failed";
        }

        // Check for on-chain failure indicators
        if (output.includes("No such transaction")) {
          tx.errorReason = "TransactionNotFound";
          tx.status = "failed";
        } else if (output.includes("unchanged") && output.includes("✓ Transaction confirmed!")) {
          tx.errorReason = "TransactionFailedOnChain";
          tx.status = "failed";
        }
      }

      function appendTransactionOutput(txId, chunk) {
        const tx = transactions.find((t) => t.id === txId);
        if (tx) {
          tx.fullOutput += chunk;
          
          // Extract blockchain data as chunks arrive
          extractBlockchainData(tx, tx.fullOutput);
          
          // Update the detail div if it's currently visible
          const detailDiv = document.getElementById(`detail-${txId}`);
          if (detailDiv && detailDiv.style.display === "block") {
            detailDiv.innerHTML = tx.fullOutput || "No output captured yet...";
            detailDiv.scrollTop = detailDiv.scrollHeight;
          }
          
          // Update the log display to show new blockchain data
          updateLogDisplay();
        }
      }

      function updateLogDisplay() {
        const logDiv = document.getElementById("transactionLog");
        logDiv.innerHTML = "";

        transactions
          .slice()
          .reverse()
          .forEach((tx) => {
            const entryDiv = document.createElement("div");
            entryDiv.className = `log-entry ${tx.status}`;
            entryDiv.onclick = () => toggleLogDetail(tx.id);

            let displayInfo = `<strong>${tx.type.toUpperCase()}</strong> on ${tx.miner} at ${tx.timestamp} - Status: ${tx.status.toUpperCase()}`;
            
            // Add blockchain data if available
            const details = [];
            if (tx.realTxId) {
              details.push(`TX: ${tx.realTxId}`);
            }
            if (tx.nonce) {
              details.push(`Nonce: ${tx.nonce}`);
            }
            if (tx.stacksHeight) {
              details.push(`Block: ${tx.stacksHeight}`);
            }
            if (tx.errorReason) {
              details.push(`Error: ${tx.errorReason}`);
            }
            
            if (details.length > 0) {
              displayInfo += `<br><small>${details.join(' | ')}</small>`;
            }
            
            entryDiv.innerHTML = displayInfo;

            const detailDiv = document.createElement("div");
            detailDiv.id = `detail-${tx.id}`;
            detailDiv.className = "log-detail";
            detailDiv.innerHTML = tx.fullOutput || "No output captured yet...";

            logDiv.appendChild(entryDiv);
            logDiv.appendChild(detailDiv);
          });
      }

      function toggleLogDetail(txId) {
        const detailDiv = document.getElementById(`detail-${txId}`);
        if (
          detailDiv.style.display === "none" ||
          detailDiv.style.display === ""
        ) {
          detailDiv.style.display = "block";
        } else {
          detailDiv.style.display = "none";
        }
      }

      async function createTransaction() {
        const miner = document.getElementById("minerSelectTx").value;
        const txId = generateTransactionId();

        try {
          const logEntry = addLogEntry(txId, "transaction", miner, "mempool");

          const response = await fetch("/execute", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              command: `bash create-transaction.sh ${miner}`,
              type: "transaction",
            }),
          });

          if (!response.ok) {
            updateTransactionStatus(txId, "failed");
            return;
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let output = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            output += chunk;
            
            // Update the transaction output in real-time
            appendTransactionOutput(txId, chunk);
            
            // Check for transaction ID as we receive chunks
            const txIdMatch = output.match(/Transaction ID: "([a-f0-9]+)"/);
            const errorMatch = output.match(/Transaction ID: \{"error":"transaction rejected","reason":"([^"]+)","txid":"([a-f0-9]+)"\}/);
            
            if (errorMatch && !transactions.find(t => t.id === txId).realTxId) {
              // Handle JSON error response
              const realTxId = errorMatch[2];
              const errorReason = errorMatch[1];
              updateTransactionStatus(txId, "failed", realTxId);
            } else if (txIdMatch && !transactions.find(t => t.id === txId).realTxId) {
              // Handle normal transaction ID
              const realTxId = txIdMatch[1];
              updateTransactionStatus(txId, "mempool", realTxId);
            }
            
            // Check for confirmation as we receive chunks
            if (output.includes("✓ Transaction confirmed!")) {
              const txIdMatch = output.match(/Transaction ID: "([a-f0-9]+)"/);
              const realTxId = txIdMatch ? txIdMatch[1] : null;
              
              // Only mark as confirmed if we have successful JSON result
              if (output.includes('"result": "(ok true)"')) {
                updateTransactionStatus(txId, "confirmed", realTxId);
              } else if (output.includes("No such transaction") || output.includes("unchanged")) {
                // Transaction was processed but failed on-chain
                updateTransactionStatus(txId, "failed", realTxId);
              }
            }
          }

          // Final check if script failed
          const txIdMatch = output.match(/Transaction ID: "([a-f0-9]+)"/);
          const errorMatch = output.match(/Transaction ID: \{"error":"transaction rejected"/);
          
          if (
            output.includes("Process exited with code 1") ||
            output.includes("Error:") ||
            output.includes("Invalid miner") ||
            output.includes("Failed to decode") ||
            output.includes("Failed to deserialize") ||
            errorMatch ||
            (!txIdMatch && !errorMatch)
          ) {
            updateTransactionStatus(txId, "failed");
            return;
          }

          // If not confirmed yet, start polling
          if (!output.includes("✓ Transaction confirmed!") || !output.includes('"result": "(ok true)"')) {
            const realTxId = txIdMatch[1];
            setTimeout(() => verifyTransaction(txId, realTxId, miner), 2000);
          }
        } catch (error) {
          console.error("Transaction creation error:", error);
          updateTransactionStatus(
            txId,
            "failed",
            null,
            `Error: ${error.message}`
          );
        }
      }

      async function deployContract() {
        const miner = document.getElementById("minerSelectContract").value;
        const txId = generateTransactionId();

        try {
          const logEntry = addLogEntry(txId, "contract", miner, "mempool");

          const response = await fetch("/execute", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              command: `bash deploy-contract.sh ${miner}`,
              type: "contract",
            }),
          });

          if (!response.ok) {
            updateTransactionStatus(txId, "failed");
            return;
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let output = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            output += chunk;
            
            // Update the transaction output in real-time
            appendTransactionOutput(txId, chunk);
            
            // Check for transaction ID as we receive chunks
            const txIdMatch = output.match(/Transaction ID: "([a-f0-9]+)"/);
            const errorMatch = output.match(/Transaction ID: \{"error":"transaction rejected","reason":"([^"]+)","txid":"([a-f0-9]+)"\}/);
            
            if (errorMatch && !transactions.find(t => t.id === txId).realTxId) {
              // Handle JSON error response
              const realTxId = errorMatch[2];
              const errorReason = errorMatch[1];
              updateTransactionStatus(txId, "failed", realTxId);
            } else if (txIdMatch && !transactions.find(t => t.id === txId).realTxId) {
              // Handle normal transaction ID
              const realTxId = txIdMatch[1];
              updateTransactionStatus(txId, "mempool", realTxId);
            }
            
            // Check for confirmation as we receive chunks
            if (output.includes("✓ Contract deployment confirmed!")) {
              const txIdMatch = output.match(/Transaction ID: "([a-f0-9]+)"/);
              const realTxId = txIdMatch ? txIdMatch[1] : null;
              
              // Only mark as confirmed if we have successful JSON result
              if (output.includes('"result": "(ok true)"')) {
                updateTransactionStatus(txId, "confirmed", realTxId);
              } else if (output.includes("No such transaction") || output.includes("unchanged")) {
                // Transaction was processed but failed on-chain
                updateTransactionStatus(txId, "failed", realTxId);
              }
            }
          }

          // Final check if script failed
          const txIdMatch = output.match(/Transaction ID: "([a-f0-9]+)"/);
          const errorMatch = output.match(/Transaction ID: \{"error":"transaction rejected"/);
          
          if (
            output.includes("Process exited with code 1") ||
            output.includes("Error:") ||
            output.includes("Invalid miner") ||
            output.includes("Failed to decode") ||
            output.includes("Failed to deserialize") ||
            errorMatch ||
            (!txIdMatch && !errorMatch)
          ) {
            updateTransactionStatus(txId, "failed");
            return;
          }

          // If not confirmed yet, start polling
          if (!output.includes("✓ Contract deployment confirmed!") || !output.includes('"result": "(ok true)"')) {
            const realTxId = txIdMatch[1];
            setTimeout(() => verifyTransaction(txId, realTxId, miner), 2000);
          }
        } catch (error) {
          console.error("Contract deployment error:", error);
          updateTransactionStatus(
            txId,
            "failed",
            null,
            `Error: ${error.message}`
          );
        }
      }

      async function verifyTransaction(txId, realTxId, miner) {
        const minerPorts = {
          miner1: 20443,
          miner2: 30443,
          miner3: 40443,
        };

        const port = minerPorts[miner];
        const apiUrl = `http://localhost:${port}`;

        let attempts = 0;
        const maxAttempts = 15;
        const interval = 3000;

        const checkStatus = async () => {
          try {
            // Use POST method for v3/transaction endpoint as per OpenAPI spec
            const response = await fetch(
              `${apiUrl}/v3/transaction/${realTxId}`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
              }
            );

            if (response.ok) {
              const txData = await response.json();
              // Check if transaction result indicates success/completion
              if (txData && txData.result) {
                updateTransactionStatus(txId, "confirmed");
                return;
              }
            }

            attempts++;
            if (attempts < maxAttempts) {
              setTimeout(checkStatus, interval);
            }
          } catch (error) {
            attempts++;
            if (attempts < maxAttempts) {
              setTimeout(checkStatus, interval);
            }
          }
        };

        // Start checking after a short delay
        setTimeout(checkStatus, 3000);
      }

      async function startMonitoring() {
        const miner = document.getElementById("minerSelectMonitor").value;
        const output = document.getElementById("monitorOutput");

        document.getElementById("startMonitorBtn").style.display = "none";
        document.getElementById("stopMonitorBtn").style.display = "inline";

        output.innerHTML = `Starting monitoring for ${miner}...\n`;

        try {
          const response = await fetch("/execute", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              command: `bash monitor-chain.sh ${miner}`,
              type: "monitor",
            }),
          });

          if (!response.ok) {
            throw new Error("Monitor startup failed");
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            output.innerHTML += chunk;
            output.scrollTop = output.scrollHeight;
          }
        } catch (error) {
          output.innerHTML += `\nError: ${error.message}`;
        }
      }

      function stopMonitoring() {
        fetch("/stop-monitor", { method: "POST" });

        document.getElementById("startMonitorBtn").style.display = "inline";
        document.getElementById("stopMonitorBtn").style.display = "none";

        const output = document.getElementById("monitorOutput");
        output.innerHTML += "\n\nMonitoring stopped.\n";
      }
    </script>
  </body>
</html>
